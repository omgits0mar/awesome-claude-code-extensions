name: Deploy searchable catalog

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test, rebuild, and validate the catalog
        run: make all

      - name: Require generated catalog files to be current
        run: git diff --exit-code

      - name: Assemble the static site
        run: |
          mkdir -p _site/catalog
          cp -R site/. _site/
          cp catalog/catalog.json _site/catalog/catalog.json
          cp catalog/catalog.csv _site/catalog/catalog.csv
          cp catalog/stats.json _site/catalog/stats.json
          touch _site/.nojekyll

      - name: Fetch current repository stars and avatars
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/fetch_github_metadata.py
          --output _site/github-metadata.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
